<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PteroPal Dashboard</title>
  <meta name="description" content="PteroPal — Server backup management dashboard with folder browser and panel connectivity testing.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-content">
      <div class="logo">
        <div class="logo-icon">
          <i class="bi bi-server"></i>
        </div>
        <div class="logo-text">
          <h1>PteroPal</h1>
          <span class="logo-subtitle">Backup Manager</span>
        </div>
      </div>
    </div>
  </header>

  <main class="container">

    <!-- ═══════════ Backup Folders Section ═══════════ -->
    <section class="section" id="foldersSection">
      <div class="section-header">
        <div class="section-title">
          <div class="section-icon-wrap">
            <i class="bi bi-folder"></i>
          </div>
          <h2>Backup Folders</h2>
        </div>
        <div class="section-actions">
          <button class="btn btn-outline" id="testFoldersBtn" onclick="testFolderAccess()">
            <i class="bi bi-check-circle"></i>
            Test Access
          </button>
        </div>
      </div>

      <!-- Folder List -->
      <div id="folderList" class="folder-list">
        <!-- Populated dynamically -->
      </div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state" style="display: none;">
        <div class="empty-icon">
          <i class="bi bi-folder-plus"></i>
        </div>
        <p class="empty-title">No folders configured</p>
        <p class="empty-hint">Click the + button below to add your first backup folder</p>
      </div>

      <!-- Test Results -->
      <div id="folderTestResults" class="test-results" style="display: none;">
        <!-- Populated dynamically -->
      </div>

      <!-- Add Folder FAB -->
      <button class="fab" id="addFolderFab" onclick="openBrowserModal()" title="Add backup folder">
        <i class="bi bi-plus-lg"></i>
      </button>
    </section>

    <!-- ═══════════ Panel Connections Section ═══════════ -->
    <section class="section" id="panelsSection">
      <div class="section-header">
        <div class="section-title">
          <div class="section-icon-wrap">
            <i class="bi bi-display"></i>
          </div>
          <h2>Panel Connections</h2>
        </div>
        <div class="section-actions">
          <button class="btn btn-outline" id="testPanelsBtn" onclick="testPanelConnections()">
            <i class="bi bi-check-circle"></i>
            Test Connections
          </button>
        </div>
      </div>

      <!-- Panel Test Results -->
      <div id="panelTestResults" class="test-results">
        <div class="test-placeholder">
          <i class="bi bi-lightbulb" style="opacity: 0.4;"></i>
          <span>Click "Test Connections" to verify panel API connectivity</span>
        </div>
      </div>
    </section>

  </main>

  <!-- ═══════════ Folder Browser Modal ═══════════ -->
  <div id="browserModal" class="modal-overlay" style="display: none;">
    <div class="modal" role="dialog" aria-label="Browse Folders">
      <div class="modal-header">
        <h3>Browse Folders</h3>
        <button class="modal-close" onclick="closeBrowserModal()" aria-label="Close">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <!-- Breadcrumb Navigation -->
      <div id="breadcrumb" class="breadcrumb">
        <!-- Populated dynamically -->
      </div>

      <!-- Directory List -->
      <div id="directoryList" class="directory-list">
        <div class="directory-loading">
          <div class="spinner"></div>
          <span>Loading directories...</span>
        </div>
      </div>

      <!-- Selected Path -->
      <div class="modal-field">
        <label>Selected Path</label>
        <div id="selectedPath" class="selected-path">/</div>
      </div>

      <!-- Folder Name Input -->
      <div class="modal-field">
        <label for="folderName">Folder Name</label>
        <input
          type="text"
          id="folderName"
          class="modal-input"
          placeholder="e.g., minecraft, satisfactory"
          autocomplete="off"
          spellcheck="false"
        >
      </div>

      <!-- Modal Actions -->
      <div class="modal-actions">
        <button class="btn btn-ghost" onclick="closeBrowserModal()">Cancel</button>
        <button class="btn btn-primary" id="addFolderBtn" onclick="addFolder()">
          <i class="bi bi-plus-lg"></i>
          Add Folder
        </button>
      </div>
    </div>
  </div>

  <!-- ═══════════ Toast Notification ═══════════ -->
  <div id="toast" class="toast">
    <div class="toast-content">
      <span id="toastIcon" class="toast-icon"></span>
      <span id="toastMessage" class="toast-message"></span>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
